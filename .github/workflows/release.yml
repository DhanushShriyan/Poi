name: Publish Poi update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poi-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4

      - name: Validate signing and cloud secrets
        env:
          POI_KEYSTORE_BASE64: ${{ secrets.POI_KEYSTORE_BASE64 }}
          POI_KEYSTORE_PASSWORD: ${{ secrets.POI_KEYSTORE_PASSWORD }}
          POI_KEY_ALIAS: ${{ secrets.POI_KEY_ALIAS }}
          POI_KEY_PASSWORD: ${{ secrets.POI_KEY_PASSWORD }}
          POI_SUPABASE_URL: ${{ secrets.POI_SUPABASE_URL }}
          POI_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.POI_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$POI_KEYSTORE_BASE64"
          test -n "$POI_KEYSTORE_PASSWORD"
          test -n "$POI_KEY_ALIAS"
          test -n "$POI_KEY_PASSWORD"
          test -n "$POI_SUPABASE_URL"
          test -n "$POI_SUPABASE_PUBLISHABLE_KEY"

      - name: Prepare version and signing key
        env:
          POI_KEYSTORE_BASE64: ${{ secrets.POI_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$POI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/poi-update.jks"
          echo "POI_KEYSTORE_PATH=$RUNNER_TEMP/poi-update.jks" >> "$GITHUB_ENV"
          echo "POI_VERSION_CODE=$((2000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "POI_VERSION_NAME=0.2.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Test and build signed update
        env:
          POI_KEYSTORE_PASSWORD: ${{ secrets.POI_KEYSTORE_PASSWORD }}
          POI_KEY_ALIAS: ${{ secrets.POI_KEY_ALIAS }}
          POI_KEY_PASSWORD: ${{ secrets.POI_KEY_PASSWORD }}
          POI_SUPABASE_URL: ${{ secrets.POI_SUPABASE_URL }}
          POI_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.POI_SUPABASE_PUBLISHABLE_KEY }}
          POI_GOOGLE_AUTH_ENABLED: ${{ secrets.POI_GOOGLE_AUTH_ENABLED }}
          POI_PHONE_AUTH_ENABLED: ${{ secrets.POI_PHONE_AUTH_ENABLED }}
        run: ./gradlew lintDebug test assembleRelease --stacktrace

      - name: Prepare release asset
        run: cp app/build/outputs/apk/release/app-release.apk "poi-${POI_VERSION_NAME}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${POI_VERSION_NAME}" >/dev/null 2>&1; then
            gh release upload "v${POI_VERSION_NAME}" "poi-${POI_VERSION_NAME}.apk" --clobber
          else
            gh release create "v${POI_VERSION_NAME}" "poi-${POI_VERSION_NAME}.apk" \
              --title "Poi ${POI_VERSION_NAME}" \
              --notes "Automatic signed update from commit ${GITHUB_SHA}."
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: poi-${{ env.POI_VERSION_NAME }}
          path: poi-${{ env.POI_VERSION_NAME }}.apk
          retention-days: 30
